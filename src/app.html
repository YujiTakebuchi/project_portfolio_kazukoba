<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#F2F2F2" />

		<!--
			favicon

			SVG を読める環境（現行のブラウザ）は favicon.svg、読めない環境と
			ブックマーク等は favicon.ico、iOS のホーム画面は apple-touch-icon。
			ルートの /favicon.ico はブラウザが勝手に取りに来るので static に置く。
		-->
		<link rel="icon" href="/favicon.ico" sizes="32x32" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400&family=Noto+Sans+JP:wght@350;400;500;700&family=Source+Sans+3:wght@400&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
		<noscript>
			<!--
				ローディング画面は JS で明ける（src/lib/components/ui/Loading.svelte）。
				JS が動かない環境ではいつまでも覆われたままになるので、
				演出ごと畳んで本編をそのまま見せる。
			-->
			<style>
				[data-loading] {
					display: none !important;
				}
				.split {
					opacity: 1 !important;
					pointer-events: auto !important;
				}
			</style>
		</noscript>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
